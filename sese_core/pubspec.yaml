name: sese_core
description: "Core shared models, repositories, and widgets for SeSe."
version: 0.0.1

environment:
  sdk: ^3.13.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  sign_in_button: ^5.0.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  google_sign_in: ^6.2.0
  flutter_svg: ^2.0.10+1
  audioplayers: ^6.1.0
  shared_preferences: ^2.5.5
  intl_phone_number_input: ^0.7.5
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  firebase_storage: ^13.6.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/sese_logo.svg
    - assets/sese_logo_hub.svg
    - assets/sounds/online_chime.mp3
    - assets/sounds/offline_chime.mp3
    - assets/sounds/incoming_message.mp3
    - assets/sounds/incoming_order_alert.mp3
    - assets/sounds/sese_alert_high.wav
    - assets/sounds/sese_alert_pulse.wav
    - assets/sounds/sese_alert_chime.wav
    - assets/sounds/sese_alert_siren.wav
    - assets/sounds/sese_alert_digital.wav
