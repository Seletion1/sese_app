name: Sese CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  flutter-ci:
    name: Flutter Packages CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Analyze & Test sese_core
        run: |
          cd sese_core
          flutter pub get
          flutter analyze
          flutter test

      - name: Analyze & Test sese_ride
        run: |
          cd sese_ride
          flutter pub get
          flutter analyze
          flutter test test/places_autocomplete_test.dart test/review_contact_phones_test.dart test/live_trip_screen_test.dart test/widget_test.dart test/dropoff_geofence_test.dart

      - name: Analyze & Test sese_hub
        run: |
          cd sese_hub
          flutter pub get
          flutter analyze
          flutter test

  backend-ci:
    name: Cloud Functions Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & run tests in functions
        run: |
          cd functions
          npm ci || npm install
          npm run build
          npm test
