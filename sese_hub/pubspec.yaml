name: sese_hub
description: "SeSe Hub Management Application."
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  sese_core:
    path: ../sese_core

  firebase_core: ^4.15.0
  firebase_app_check: ^0.4.7
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  google_sign_in: ^6.2.0
  firebase_storage: ^13.6.0
  image_picker: ^1.2.3
  cloud_functions: ^6.5.0
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - shorebird.yaml
